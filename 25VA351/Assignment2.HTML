<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border-radius: 4px;
            display: none;
        }
        .pass {
            color: green;
            font-weight: bold;
        }
        .fail {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Management System</h2>
    
    <div class="form-group">
        <label for="name">Student Name:</label>
        <input type="text" id="name" placeholder="Enter name">
    </div>
    
    <div class="form-group">
        <label for="rollNo">Roll Number:</label>
        <input type="text" id="rollNo" placeholder="Enter roll number">
    </div>
    
    <div class="form-group">
        <label for="m1">Subject 1 Marks (out of 100):</label>
        <input type="number" id="m1" placeholder="Enter marks for Subject 1">
    </div>
    
    <div class="form-group">
        <label for="m2">Subject 2 Marks (out of 100):</label>
        <input type="number" id="m2" placeholder="Enter marks for Subject 2">
    </div>

    <button onclick="processStudentData()">Generate Report</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    // Function taking parameters to perform calculations
    function calculateResult(m1, m2) {
        let total = m1 + m2;
        let percentage = (total / 200) * 100;
        
        // Conditional Statement: Must score > 40 in BOTH subjects to PASS
        let status = (m1 > 40 && m2 > 40) ? "Pass" : "Fail";
        
        // Grade Logic based on percentage
        let grade;
        if (status === "Fail") {
            grade = "F";
        } else if (percentage >= 75) {
            grade = "A";
        } else if (percentage >= 60) {
            grade = "B";
        } else if (percentage >= 50) {
            grade = "C";
        } else {
            grade = "D";
        }

        return {
            total: total,
            percentage: percentage.toFixed(2),
            status: status,
            grade: grade
        };
    }

    // Function to handle inputs and display results
    function processStudentData() {
        let name = document.getElementById('name').value;
        let rollNo = document.getElementById('rollNo').value;
        let m1 = parseFloat(document.getElementById('m1').value);
        let m2 = parseFloat(document.getElementById('m2').value);

        if (!name || !rollNo || isNaN(m1) || isNaN(m2)) {
            alert("Please fill in all fields correctly.");
            return;
        }

        // Call the calculation function using parameters
        let res = calculateResult(m1, m2);

        // Display results dynamically
        let resultDiv = document.getElementById('result');
        resultDiv.style.display = "block";
        resultDiv.innerHTML = `
            <h3>Student Report</h3>
            <p><strong>Name:</strong> ${name}</p>
            <p><strong>Roll No:</strong> ${rollNo}</p>
            <p><strong>Total Marks:</strong> ${res.total} / 200</p>
            <p><strong>Percentage:</strong> ${res.percentage}%</p>
            <p><strong>Grade:</strong> ${res.grade}</p>
            <p><strong>Status:</strong> <span class="${res.status.toLowerCase()}">${res.status}</span></p>
        `;
    }
</script>

</body>
</html>
