<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        .box{
            width:80%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
        }

        input,select,button{
            padding:8px;
            margin:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table,th,td{
            border:1px solid black;
        }

        th,td{
            padding:10px;
            text-align:center;
        }

        button{
            cursor:pointer;
        }

        #msg{
            color:red;
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="box">

<h1>Student Management System</h1>

<input type="text" id="name" placeholder="Student Name">

<input type="text" id="roll" placeholder="Roll No">

<select id="branch">
<option value="">Select Branch</option>
<option>CSE</option>
<option>CSE-DS</option>
<option>AIML</option>
<option>IT</option>
<option>ECE</option>
</select>

<button onclick="addStudent()">Add Student</button>

<br><br>

<input type="text" id="search" placeholder="Search by Name" onkeyup="displayStudents()">

<select id="filter" onchange="displayStudents()">
<option value="All">All Branches</option>
<option>CSE</option>
<option>CSE-DS</option>
<option>AIML</option>
<option>IT</option>
<option>ECE</option>
</select>

<h3>Total Students : <span id="total">0</span></h3>

<table>
<thead>
<tr>
<th>Name</th>
<th>Roll</th>
<th>Branch</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="tableBody">

</tbody>

</table>

<p id="msg"></p>

</div>

<script>

let students=[
{name:"Rahul",roll:"101",branch:"CSE"},
{name:"Aman",roll:"102",branch:"IT"},
{name:"Priya",roll:"103",branch:"CSE-DS"}
];

function addStudent(){

let name=document.getElementById("name").value;
let roll=document.getElementById("roll").value;
let branch=document.getElementById("branch").value;

if(name=="" || roll=="" || branch==""){
alert("Fill all fields");
return;
}

students.push({
name:name,
roll:roll,
branch:branch
});

document.getElementById("name").value="";
document.getElementById("roll").value="";
document.getElementById("branch").value="";

displayStudents();

}

function deleteStudent(index){

students.splice(index,1);

displayStudents();

}

function displayStudents(){

let body=document.getElementById("tableBody");

body.innerHTML="";

let search=document.getElementById("search").value.toLowerCase();

let filter=document.getElementById("filter").value;

let count=0;

students.forEach((s,index)=>{

if(
s.name.toLowerCase().includes(search) &&
(filter=="All" || s.branch==filter)
){

count++;

body.innerHTML+=`
<tr>
<td>${s.name}</td>
<td>${s.roll}</td>
<td>${s.branch}</td>
<td>
<button onclick="deleteStudent(${index})">
Delete
</button>
</td>
</tr>
`;

}

});

document.getElementById("total").innerHTML=count;

if(count==0){
document.getElementById("msg").innerHTML="No Record Found";
}
else{
document.getElementById("msg").innerHTML="";
}

}

displayStudents();

</script>

</body>
</html>
