<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Management System</title>
</head>

<body>

    <h1>Student Information Management System</h1>

    <form>

        <label for="name">Student Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" name="roll">
        <br><br>

        <label for="subject1">Subject 1 Marks:</label>
        <input type="number" id="subject1" name="subject1">
        <br><br>

        <label for="subject2">Subject 2 Marks:</label>
        <input type="number" id="subject2" name="subject2">
        <br><br>

        <button type="submit">Generate Report</button>

    </form>

    <h2>Student Report</h2>

    <p>Student Name: __________</p>
    <p>Roll Number: __________</p>
    <p>Total Marks: __________</p>
    <p>Percentage: __________</p>
    <p>Grade: __________</p>
    <p>Status: __________</p>

</body>
</html>
